name: Bug Report
description: Report a reproducible bug in ezCORE
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it.

        **Before submitting:**
        - Search existing issues to avoid duplicates
        - Test on the latest build (GitHub Actions artifacts or latest release)
        - If it's a core-specific issue, note which core and game

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does this occur?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Linux x64
        - Android (arm64)
        - iOS (arm64)
        - Multiple / Not sure
    validations:
      required: true

  - type: dropdown
    id: core
    attributes:
      label: Core (if emulation-related)
      description: Which core is involved? Leave blank if not core-specific.
      options:
        - sameboy (GB/GBC)
        - gambatte (GB/GBC)
        - mgba (GBA/GB/GBC)
        - mesen (NES/FDS)
        - snes9x (SNES)
        - genesis_plus_gx (Genesis/SMS/GG)
        - stella (Atari 2600)
        - beetle_pce (PCE/TG-16)
        - dosbox_pure (DOS)
        - fbneo (Arcade/NeoGeo)
        - scummvm (SCUMM)
        - swanstation (PS1)
        - mupen64plus (N64)
        - melonds (DS)
        - ppsspp (PSP)
        - flycast (Dreamcast)
        - dolphin (GC/Wii)
        - beetle_saturn (Saturn)
        - Not core-specific / Unknown
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happens vs what you expected?
      placeholder: |
        Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Describe the buggy behavior, include error messages.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output
      description: Paste relevant logs (flutter run output, crash logs, core stdout). Use code blocks.
      render: text
      placeholder: |
        [paste logs here]

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant system info
      placeholder: |
        - OS version:
        - Flutter version: `flutter --version`
        - ezCORE version: `0.x.x` or commit hash
        - Core version (if known): check Systems screen
        - Device model:
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am not reporting a missing ROM/BIOS/game file (we don't ship those)
          required: true
        - label: This is not a request for Switch/3DS/PS2 cores (holds, see TRADEMARKS.md)
          required: true