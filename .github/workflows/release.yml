name: Release

# Builds the desktop downloads and prepares a draft release. A person reviews
# the draft and publishes it; the workflow never publishes on its own.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          set -euo pipefail
          flutter pub get
          flutter build macos --release
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -q -ry "$GITHUB_WORKSPACE/dist/ezcore-${TAG}-macos-arm64.zip" ezCore.app
      - name: Import signing certificate
        if: >-
          env.MACOS_CERT_P12 != '' && env.MACOS_CERT_PASSWORD != '' &&
          env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' &&
          env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ezcore-signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/ezcore.p12"
          security import "$RUNNER_TEMP/ezcore.p12" \
            -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -A
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/ezcore.p12"
      - name: Sign and notarise
        if: >-
          env.MACOS_CERT_P12 != '' && env.MACOS_CERT_PASSWORD != '' &&
          env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' &&
          env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/ezCore.app"
          codesign --force --deep --options runtime --timestamp -s \
            "$APPLE_TEAM_ID" "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ezcore-notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/ezcore-notarise.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          cd build/macos/Build/Products/Release
          rm -f "$GITHUB_WORKSPACE/dist/ezcore-${TAG}-macos-arm64.zip"
          zip -q -ry "$GITHUB_WORKSPACE/dist/ezcore-${TAG}-macos-arm64.zip" ezCore.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter pub get
          flutter build windows --release
      - name: Portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\ezcore-$env:TAG-windows-x64.zip" -Force
      - name: Installer
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed" }
          & $iscc /DMyAppVersion=$version `
            "windows\installer\ezcore.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libpng-dev \
            libgtk-3-dev clang desktop-file-utils
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          set -euo pipefail
          flutter pub get
          flutter build linux --release
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/ezcore-${TAG}-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle
      - name: AppImage
        env:
          UPDATE_INFORMATION: >-
            gh-releases-zsync|0xJ1nn|ezcore|latest|ezcore-*x86_64.AppImage.zsync
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          appdir="$RUNNER_TEMP/ezcore.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a build/linux/x64/release/bundle/. "$appdir/usr/bin/"
          cp assets/branding/app-icon-1024.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/ezcore.png"
          cat > "$appdir/ezcore.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ezCORE
          Exec=ezcore
          Icon=ezcore
          Categories=Game;
          DESKTOP
          cp "$appdir/ezcore.desktop" \
            "$appdir/usr/share/applications/ezcore.desktop"
          ln -sf usr/share/icons/hicolor/256x256/apps/ezcore.png \
            "$appdir/ezcore.png"
          "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$appdir" "dist/ezcore-${TAG}-x86_64.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft release
    needs: [macos, windows, linux]
    if: always() && !cancelled() &&
      (needs.macos.result == 'success' ||
       needs.windows.result == 'success' ||
       needs.linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          python3 scripts/checksums.py --write --root dist \
            --record SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Release notes from changelog
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 - "$version" <<'PY' > notes.md
          import sys
          version = sys.argv[1]
          lines = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          start = next(
              (i for i, l in enumerate(lines)
               if l.strip() == f'## [{version}]'),
              None,
          )
          if start is None:
              start = next(
                  (i for i, l in enumerate(lines)
                   if l.strip() == '## [Unreleased]'),
                  None,
              )
          if start is None:
              print(f'No changelog section for {version}.', file=sys.stderr)
              sys.exit(1)
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].startswith('## [')),
              len(lines),
          )
          print('\n'.join(lines[start + 1:end]).strip())
          PY
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(dist/*)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "No release assets were built." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --notes-file notes.md \
            "${assets[@]}"
