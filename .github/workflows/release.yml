name: Release

# Manual dispatch: builds each requested platform, uploads artifacts, and
# creates the GitHub Release from .github/release-notes/<version>.md when
# that file exists (else generated notes). iOS is intentionally absent —
# no signing identity yet (see docs/RELEASE_PLAN.md).
#
# CI is currently paused on the maintainer account (Actions billing); the
# local path in docs/RELEASING.md is the working alternative.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.1)"
        required: true
        type: string
      platforms:
        description: "Comma-separated platforms to build"
        required: false
        default: "macos,windows,linux,android"
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  # ============ macOS ============
  release-macos:
    if: github.event.inputs.platforms == '' || contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Prereqs
        run: brew install cmake ninja pkg-config make rgbds libpng mad || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup
        run: |
          python3 scripts/fill_manifest_data.py --check
          python3 scripts/build_catalog.py
          scripts/build_core.sh --fetch-headers
          scripts/build_runtime.sh macos
          # Full desktop tier: release.sh verifies the staged set against
          # the committed pins, so a partial tier fails the gate on purpose.
          scripts/build_core.sh --tier-desktop
      - name: Release build
        env:
          EZCORE_VERSION: ${{ github.event.inputs.version || 'dev' }}
          EZCORE_CODESIGN_IDENTITY: ${{ secrets.EZCORE_CODESIGN_IDENTITY }}
        run: scripts/release.sh macos --out dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcore-macos
          path: dist/ezcore-*-macos-arm64.zip
          retention-days: 30

  # ============ Windows ============
  release-windows:
    if: github.event.inputs.platforms == '' || contains(github.event.inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja python
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup
        shell: msys2 {0}
        run: |
          python scripts/fill_manifest_data.py --check
          python scripts/build_catalog.py
          scripts/build_runtime.sh windows
          EZCORE_PLATFORM=windows scripts/build_core.sh --tier-desktop
      - name: Release build
        shell: msys2 {0}
        env:
          EZCORE_VERSION: ${{ github.event.inputs.version || 'dev' }}
        run: scripts/release.sh windows --out dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcore-windows
          path: dist/ezcore-*-windows-x64.zip
          retention-days: 30

  # ============ Linux ============
  release-linux:
    if: github.event.inputs.platforms == '' || contains(github.event.inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libpng-dev libgtk-3-dev clang
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup
        run: |
          python3 scripts/fill_manifest_data.py --check
          python3 scripts/build_catalog.py
          scripts/build_core.sh --fetch-headers
          scripts/build_runtime.sh linux
          EZCORE_PLATFORM=linux scripts/build_core.sh --tier-desktop
      - name: Release build
        env:
          EZCORE_VERSION: ${{ github.event.inputs.version || 'dev' }}
        run: scripts/release.sh linux --out dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcore-linux
          path: dist/ezcore-*-linux-x64.tar.gz
          retention-days: 30

  # ============ Android ============
  release-android:
    if: github.event.inputs.platforms == '' || contains(github.event.inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      # Mapped here so the step can test presence (secrets aren't usable in
      # step `if:` conditionals directly).
      EZCORE_KEYSTORE_BASE64: ${{ secrets.EZCORE_KEYSTORE_BASE64 }}
      EZCORE_KEYSTORE_PASSWORD: ${{ secrets.EZCORE_KEYSTORE_PASSWORD }}
      EZCORE_KEY_ALIAS: ${{ secrets.EZCORE_KEY_ALIAS }}
      EZCORE_KEY_PASSWORD: ${{ secrets.EZCORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-34"
      - name: Setup
        run: |
          python3 scripts/fill_manifest_data.py --check
          python3 scripts/build_catalog.py
          scripts/build_runtime.sh android
          EZCORE_PLATFORM=android scripts/build_core.sh --tier-android
      - name: Release build (release-signed when the keystore secret exists)
        env:
          EZCORE_VERSION: ${{ github.event.inputs.version || 'dev' }}
        run: |
          if [ -n "${EZCORE_KEYSTORE_BASE64:-}" ]; then
            echo "$EZCORE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ezcore.keystore"
            export EZCORE_KEYSTORE_FILE="$RUNNER_TEMP/ezcore.keystore"
          else
            echo "::warning title=Android signing::No EZCORE_KEYSTORE_BASE64 secret — APK will be debug-signed (not for distribution)"
          fi
          scripts/release.sh android --out dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezcore-android
          path: dist/ezcore-*-android-arm64.apk
          retention-days: 30

  # ============ Create GitHub Release ============
  create-release:
    needs: [release-macos, release-windows, release-linux, release-android]
    if: |
      always() && !cancelled() &&
      (needs.release-macos.result == 'success' ||
       needs.release-windows.result == 'success' ||
       needs.release-linux.result == 'success' ||
       needs.release-android.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # for .github/release-notes/<version>.md
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: ezcore-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -la
          shasum -a 256 ezcore-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${VERSION}.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          else
            echo "::warning title=Release notes::No $notes_file — using generated notes"
            notes=(--generate-notes)
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi

          assets=(dist/ezcore-* dist/SHA256SUMS.txt)
          [ "${#assets[@]}" -ge 2 ] || { echo "no artifacts downloaded"; exit 1; }

          gh release create "$VERSION" \
            --title "$VERSION" \
            "${notes[@]}" "${flags[@]}" \
            "${assets[@]}"

      - name: Verify Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          gh release view "$VERSION"
          gh release view "$VERSION" --json assets --jq '.assets[].name'
