name: labeler

# Applies labels from .github/labeler.yml to PRs by changed files.
# pull_request_target so fork PRs get labeled too (read-only checkout,
# no code from the PR is executed).

on:
  - pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
