name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v1 platform matrix (docs/MATRIX.md). Per-PR legs stay under ~30 min;
# the full core matrix builds on schedule (see .github/workflows/matrix.yml).
jobs:
  dart-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python3 scripts/toolchain_pin.py check
          echo "flutter=$(python3 scripts/toolchain_pin.py get flutter)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - run: flutter --version
      - run: python3 scripts/fill_manifest_data.py --check
      - run: python3 scripts/build_catalog.py
      - run: flutter pub get
      - run: flutter analyze lib/ test/
      - run: flutter test
      - run: bash scripts/banned_content_scan.sh

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python3 scripts/toolchain_pin.py check
          echo "flutter=$(python3 scripts/toolchain_pin.py get flutter)" >> "$GITHUB_OUTPUT"
      - name: toolchain
        run: >
          sudo apt-get update &&
          sudo apt-get install -y cmake ninja-build pkg-config libpng-dev
          libgtk-3-dev clang
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - run: python3 scripts/fill_manifest_data.py --check
      - run: python3 scripts/build_catalog.py
      - run: scripts/build_core.sh --fetch-headers
      - run: scripts/build_runtime.sh linux
      - run: flutter pub get
      # SameBoy excluded: its BootROMs need rgbds (unavailable via apt).
      # Covered on macOS CI + MATRIX.md.
      - name: tier1 cores (unix, minus sameboy)
        run: |
          for c in advancebit realmode; do
            EZCORE_PLATFORM=linux scripts/build_core.sh $c
          done
      - name: core matrix (Dart-driven, fork-isolated harness)
        run: flutter test test/core_matrix_test.dart
      - run: flutter build linux --debug

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python3 scripts/toolchain_pin.py check
          echo "flutter=$(python3 scripts/toolchain_pin.py get flutter)" >> "$GITHUB_OUTPUT"
      - name: prereqs
        run: brew install cmake ninja pkg-config make rgbds libpng mad
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - run: python3 scripts/fill_manifest_data.py --check
      - run: python3 scripts/build_catalog.py
      - run: scripts/build_core.sh --fetch-headers
      - run: scripts/build_runtime.sh macos
      - run: flutter pub get
      - run: scripts/build_core.sh --tier1
      - run: flutter analyze lib/ test/
      - run: flutter test
      - run: flutter build macos --debug
      - run: bash scripts/banned_content_scan.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python scripts/toolchain_pin.py check
          "flutter=$(python scripts/toolchain_pin.py get flutter)" >> $env:GITHUB_OUTPUT
      - uses: msys2/setup-msys2@v2
        with:
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja python
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - run: python scripts/fill_manifest_data.py --check
      - run: python scripts/build_catalog.py
      - run: scripts/build_runtime.sh windows
        shell: msys2 {0}
      - name: proof core (msys2 mingw, windows target)
        shell: msys2 {0}
        run: EZCORE_PLATFORM=windows scripts/build_core.sh advancebit
      - run: flutter pub get
      - run: flutter analyze lib/ test/
      - run: flutter test
      - run: flutter build windows --debug

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python3 scripts/toolchain_pin.py check
          echo "flutter=$(python3 scripts/toolchain_pin.py get flutter)" >> "$GITHUB_OUTPUT"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/$(python3 scripts/toolchain_pin.py get ndk)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - name: NDK + cmake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$(python3 scripts/toolchain_pin.py get ndk)" \
            "cmake;$(python3 scripts/toolchain_pin.py get cmake)" \
            "platforms;android-34"
      - run: python3 scripts/fill_manifest_data.py --check
      - run: python3 scripts/build_catalog.py
      - name: runtime (NDK)
        run: scripts/build_runtime.sh android
      - name: tier1 core (NDK cross)
        run: EZCORE_PLATFORM=android scripts/build_core.sh pocketbit
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The pin in toolchain.json drives every leg of this workflow.
      - name: toolchain pin
        id: pin
        run: |
          python3 scripts/toolchain_pin.py check
          echo "flutter=$(python3 scripts/toolchain_pin.py get flutter)" >> "$GITHUB_OUTPUT"
      - name: prereqs (Xcode-side tooling for core builds)
        run: brew install cmake ninja pkg-config make rgbds
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
      - run: python3 scripts/fill_manifest_data.py --check
      - run: python3 scripts/build_catalog.py
      - run: scripts/build_core.sh --fetch-headers
      - run: scripts/build_runtime.sh ios
      - name: interpreter-tier core (no-JIT toolchain proof)
        run: EZCORE_PLATFORM=ios scripts/build_core.sh sameboy
      - run: flutter pub get
      - run: flutter build ios --no-codesign
